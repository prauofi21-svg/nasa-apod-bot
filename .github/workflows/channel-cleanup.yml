name: Channel Cleanup

# Maintenance utility: delete specific messages from the Telegram channel by
# id (e.g. duplicates or unwanted posts). Find the message ids in the channel
# preview (t.me/s/daily_sciences — each post shows "daily_sciences/NNN").
# Originally added on 2026-10-10 to remove 5 duplicate Reddit posts (198-202)
# caused by two overlapping manual runs; the root cause is fixed in
# reddit-top-daily.yml (reset to newest state before the bot runs).

on:
  workflow_dispatch:
    inputs:
      message_ids:
        description: "Comma-separated message ids to delete (e.g. 198,199,200)"
        required: true
        default: ""

jobs:
  cleanup:
    name: Delete messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IDS: ${{ inputs.message_ids }}
        run: |
          python - <<'EOF'
          import os
          import requests
          TG = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]
          ids = [m.strip() for m in os.environ["IDS"].split(",") if m.strip()]
          if not ids:
              print("no message ids given — nothing to do")
              raise SystemExit(1)
          for mid in ids:
              r = requests.post(
                  f"https://api.telegram.org/bot{TG}/deleteMessage",
                  json={"chat_id": CHAT, "message_id": int(mid)},
                  timeout=30,
              )
              body = r.json()
              print(f"delete {mid}: HTTP {r.status_code} ok={body.get('ok')} "
                    f"{body.get('description', '')}")
          EOF
