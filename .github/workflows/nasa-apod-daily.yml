name: NASA APOD Daily Post

# Posts NASA's Astronomy Picture of the Day to the Telegram channel once a
# day — as a Persian-only post (Grok/Groq translation, Jalali date, emoji +
# hashtags).
#
# Schedule resilience: GitHub Actions silently DROPS scheduled runs during
# high-load windows (it dropped BOTH slots on 2026-10-03, leaving the channel
# without its daily post). Because state.json makes every extra run a cheap
# no-op ("already posted — nothing to do"), we spread SEVEN chances across
# the evening plus one next-morning safety net. Off-the-hour minutes are used
# on purpose — :00 and :30 marks are GitHub's most congested slots.
#   - Main run:   17:30 UTC = 21:00 (Tehran)
#   - Backups:    18:15, 19:05, 19:30, 20:15, 20:45, 21:20 UTC
#   - Safety net: 09:40 UTC next morning (rare: fires only if ALL evening
#                 slots were dropped)

on:
  schedule:
    - cron: "30 17 * * *"   # main run   (21:00 Tehran)
    - cron: "15 18 * * *"   # backup 1   (21:45 Tehran)
    - cron: "5 19 * * *"    # backup 2   (22:35 Tehran)
    - cron: "30 19 * * *"   # backup 3   (23:00 Tehran)
    - cron: "15 20 * * *"   # backup 4   (23:45 Tehran)
    - cron: "45 20 * * *"   # backup 5   (00:15 Tehran)
    - cron: "20 21 * * *"   # backup 6   (00:50 Tehran)
    - cron: "40 9 * * *"    # safety net (14:10 Tehran, catches total miss)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-post even if today's APOD was already posted"
        type: boolean
        default: false
      dry_run:
        description: "Diagnostics: fetch + translate + print, do not post"
        type: boolean
        default: false

permissions:
  contents: write   # required to save state.json (duplicate protection)

concurrency:
  group: apod-daily-post
  cancel-in-progress: false

jobs:
  post:
    name: Post APOD to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and post APOD
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          STATE_FILE: state.json
          FORCE_POST: ${{ inputs.force || 'false' }}
        run: |
          # Start from the NEWEST pushed state: a queued run's checkout can
          # predate another run's state push (fixed SHA at run creation), and
          # that race could cause duplicate posts. Concurrency serializes the
          # runs, so at this point no other run is mid-flight.
          git fetch origin main
          git reset --hard origin/main
          python nasa_apod_bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state file (duplicate protection + keeps repo active)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if git diff --cached --quiet; then
            echo "state.json unchanged — nothing to commit."
          else
            git commit -m "chore: update APOD state [skip ci]"
            git pull --rebase origin main
            git push
          fi
